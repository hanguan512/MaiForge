# P3 config tuned for one RTX 4070 (12 GB) on Windows.
# Data prep: see docs/TRAINING.md. This file only changes batch/worker sizing.
seed: 42
device: auto
output_dir: runs/p3_4070

data:
  manifest: data/samples/manifest.jsonl
  features_dir: data/features
  window_bars: 16
  stride_bars: 8
  context_bars: 2
  min_events: 1
  max_windows_per_chart: null
  max_audio_frames: 4096
  min_alignment: 0.0
  spec_augment:
    prob: 0.5
    freq_mask: 8
    time_mask: 16

model:
  hidden: 256
  audio_layers: 4
  decoder_layers: 6
  heads: 8
  ffn: 1024
  dropout: 0.1
  max_audio_frames: 4096
  max_tokens: 4096
  n_mels: 80

train:
  # batch 16 reached ~11.6/12 GB on a 4070; 8 x 2 accumulation keeps the same
  # effective batch and peaks around 7 GB.
  batch_size: 8
  grad_accum: 2
  epochs: 30
  lr: 0.0003
  weight_decay: 0.01
  warmup_steps: 500
  grad_clip: 1.0
  label_smoothing: 0.0
  amp: true
  num_workers: 2
  log_every: 20
  save_every: 5
  patience: 8
  max_steps: null
