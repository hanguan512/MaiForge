# P3 config tuned for one RTX 4070 (12 GB) on Windows.
# Data prep: see docs/TRAINING.md. This file only changes batch/worker sizing.
seed: 42
device: auto
output_dir: runs/p3_4070

data:
  manifest: data/samples/manifest.jsonl
  features_dir: data/features
  window_bars: 16
  stride_bars: 8
  context_bars: 2
  min_events: 1
  max_windows_per_chart: null
  max_audio_frames: 4096
  chart_cache_size: 512
  feature_cache_size: 64
  min_alignment: 0.0
  # Same-tick events used to be tokenized in kind-alphabetical order (slides
  # before taps); shuffle each window deterministically to remove that cue.
  shuffle_same_tick_events: true
  spec_augment:
    prob: 0.5
    freq_mask: 8
    time_mask: 16

model:
  hidden: 256
  audio_layers: 4
  decoder_layers: 6
  heads: 8
  ffn: 1024
  dropout: 0.1
  max_audio_frames: 4096
  max_tokens: 4096
  n_mels: 80
  # Architecture v2 (incompatible with v1 checkpoints; retrain).
  embed_scale: true
  final_norm: true
  # stride 2 doubles encoder memory vs v1 stride 4.  If the 4070 OOMs, halve
  # batch_size and double grad_accum to keep the effective batch size.
  audio_stride: 2

train:
  # batch 16 reached ~11.6/12 GB on a 4070 with the v1 stride-4 encoder;
  # 8 x 2 accumulation keeps the same effective batch.
  batch_size: 8
  grad_accum: 2
  epochs: 30
  lr: 0.0003
  weight_decay: 0.01
  warmup_steps: 500
  grad_clip: 1.0
  label_smoothing: 0.0
  amp: true
  num_workers: 2
  log_every: 20
  save_every: 5
  patience: 8
  max_steps: null
  # Rebalance the 86%-duration vocabulary in the token-level objective.
  token_class_weights:
    type: 2.0
    SLIDE: 3.0
    TOUCH: 3.0
    TOUCH_HOLD: 3.0
    structure: 1.5
    position: 1.25
  checkpoint_metric: note_score
  note_eval:
    enabled: true
    every_n_epochs: 5
    max_songs: 2
    max_windows: 4
    max_new_tokens: 2048
    temperature: 0.0
    tolerance_seconds: 0.06
    # Include the predicted/reference event-type distribution in note_score;
    # type-only accuracy misses a model that over-generates one kind.
    type_ratio_weight: 1.0
