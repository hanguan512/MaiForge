[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mainote"
version = "0.1.0"
description = "MaiForge: audio-to-maidata chart generation for maimai DX/simai"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
audio = [
  "numpy>=1.26",
  "mutagen>=1.47",
]
train = [
  "torch>=2.2",
  "pyyaml>=6",
  "numpy>=1.26",
]
web = [
  "flask>=3.0",
]
dev = ["pytest>=8"]

[project.scripts]
mainote = "mainote.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mainote.webapp" = ["templates/*.html", "static/*"]
