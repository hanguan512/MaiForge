[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mainote"
version = "0.1.0"
description = "MaiForge: audio-to-maidata chart generation for maimai DX/simai"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
audio = [
  "numpy>=1.26",
  "mutagen>=1.47",
]
train = [
  "torch>=2.2",
  "pyyaml>=6",
  "numpy>=1.26",
]
web = [
  "numpy>=1.26",
  "mutagen>=1.47",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]
dev = ["pytest>=8"]

[project.scripts]
mainote = "mainote.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mainote.webapp" = [
  "static/*",
  "static/assets/*",
  "majdataview/*",
  "majdataview/Build/*",
  "majdataview/TemplateData/*",
]
