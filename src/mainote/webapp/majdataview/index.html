<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>MajdataView</title>
    <link rel="shortcut icon" href="TemplateData/icon.ico" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #07080d;
      }
      #unity-container {
        position: relative;
        width: 100%;
        height: calc(100% - 58px);
      }
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #07080d;
        outline: none;
        cursor: default;
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 5;
        transform: translate(-50%, -50%);
        color: #d9d9e6;
        font: 13px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        pointer-events: none;
      }
      #unity-progress-bar-empty {
        width: 180px;
        height: 4px;
        margin-top: 10px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.14);
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #b9a5ff;
        transition: width 0.15s linear;
      }
      #unity-warning {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 9;
        width: 100%;
      }
      #mv-status {
        position: absolute;
        left: 50%;
        bottom: 72px;
        z-index: 6;
        display: none;
        max-width: 90%;
        padding: 7px 12px;
        transform: translateX(-50%);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        background: rgba(12, 12, 20, 0.88);
        color: #e8e8f2;
        font: 12px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        white-space: pre-line;
      }
      #mv-controls {
        position: relative;
        z-index: 7;
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        height: 58px;
        box-sizing: border-box;
        padding: 0 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.10);
        background: #0c0d16;
        color: #e8e8f2;
        font: 12px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none;
      }
      #mv-performance {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        flex: 0 0 auto;
      }
      #mv-play {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.06);
        color: #e8e8f2;
        font: 13px/1 system-ui, sans-serif;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      #mv-play:hover:not(:disabled) {
        background: rgba(185, 165, 255, 0.22);
        border-color: rgba(185, 165, 255, 0.55);
      }
      #mv-play:disabled {
        opacity: 0.35;
        cursor: default;
      }
      #mv-time {
        min-width: 92px;
        color: #98a0b8;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      #mv-seek {
        flex: 1 1 auto;
        min-width: 80px;
        height: 22px;
        margin: 0;
        accent-color: #b9a5ff;
        cursor: pointer;
      }
      #mv-levels {
        display: flex;
        align-items: center;
        gap: 5px;
        flex: 0 1 auto;
        max-width: 48%;
        overflow-x: auto;
        scrollbar-width: thin;
      }
      .mv-level {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        flex: 0 0 auto;
        height: 24px;
        padding: 0 7px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.05);
        color: #b9bed0;
        font: 800 10px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.03em;
        cursor: pointer;
        white-space: nowrap;
      }
      .mv-level b {
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0;
        font-variant-numeric: tabular-nums;
      }
      .mv-level.active {
        cursor: default;
      }
      @media (max-width: 760px) {
        #mv-controls {
          gap: 7px;
          padding: 0 8px;
        }
        #mv-time {
          min-width: 74px;
        }
        #mv-levels {
          max-width: 44%;
          gap: 3px;
        }
        .mv-level {
          padding: 0 4px;
          gap: 2px;
          font-size: 9px;
        }
        .mv-level b {
          font-size: 11px;
        }
      }
    </style>
    <!-- The loader injects chart/audio/background files into MajdataView's own
         upload inputs.  The player itself is the unmodified WebGL build. -->
    <script src="mainote-loader.js"></script>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div>MajdataView</div>
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      </div>
      <div id="unity-warning"></div>
      <div id="mv-status" role="status"></div>
    </div>

    <div id="mv-controls" role="group" aria-label="播放控制">
      <div id="mv-performance">
        <button id="mv-play" type="button" aria-label="播放" disabled>▶</button>
      </div>
      <span id="mv-time">00:00 / 00:00</span>
      <input id="mv-seek" type="range" min="0" max="60" step="0.01" value="0" aria-label="播放进度" />
      <div id="mv-levels" aria-label="难度"></div>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        var div = document.createElement("div");
        div.innerHTML = msg;
        div.style.padding = "10px";
        div.style.font = "12px system-ui, sans-serif";
        if (type === "error") {
          div.style.background = "#b3261e";
          div.style.color = "#fff";
        } else {
          div.style.background = type === "warning" ? "#f9e27d" : "#2a2a3d";
          div.style.color = "#1b1b25";
          setTimeout(function () {
            div.remove();
          }, 5000);
        }
        warningBanner.appendChild(div);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/1.loader.js";
      var config = {
        dataUrl: buildUrl + "/1.data",
        frameworkUrl: buildUrl + "/1.framework.js",
        codeUrl: buildUrl + "/1.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Lingfeng-bbben",
        productName: "MajdataView",
        productVersion: "v4.1.1",
        showBanner: unityShowBanner
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = 100 * progress + "%";
        })
          .then(function (unityInstance) {
            window.__majdataUnity = unityInstance;
            loadingBar.style.display = "none";
            window.dispatchEvent(new Event("mainote:unity-ready"));
          })
          .catch(function (message) {
            unityShowBanner(String(message), "error");
            window.__mainoteUnityFailed(String(message));
          });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
